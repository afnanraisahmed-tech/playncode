<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Advanced Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b08;--panel:#0d140f;--line:#1c2b20;--text:#c5e8cf;--dim:#6f8f78;--g:#3dff7a;--amber:#ffb454;--red:#ff5c6c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6}
.app{display:flex;height:100%}
aside{width:250px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:18px 0}
.brand{padding:0 18px 14px;font-weight:800;color:var(--g);font-size:16px}
.cur{display:inline-block;width:9px;height:16px;background:var(--g);margin-left:4px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{padding:0 18px 12px;color:var(--dim);font-size:12px}
nav{flex:1;overflow-y:auto}
nav button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--dim);font:inherit;padding:7px 18px;cursor:pointer}
nav button:hover{color:var(--text);background:#101a13}
nav button.on{color:var(--g);border-left-color:var(--g);background:#112016}
nav button .ok{margin-left:auto;color:var(--g);visibility:hidden}
nav button.done .ok{visibility:visible}
.runall{margin:12px 18px 0}
main{flex:1;min-width:0;overflow-y:auto;padding:28px clamp(16px,4vw,48px)}
.qhead{color:var(--dim);margin-bottom:6px}
.qhead b{color:var(--amber);font-weight:600}
h1{font-size:clamp(18px,2.4vw,24px);font-weight:600;line-height:1.5;margin-bottom:22px;max-width:78ch}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-bottom:0;background:var(--panel);color:var(--dim);font-size:12px}
.bar .sp{flex:1}
button.btn{background:transparent;border:1px solid var(--line);color:var(--text);font:inherit;font-size:12px;padding:5px 12px;cursor:pointer;border-radius:3px}
button.btn:hover{border-color:var(--g);color:var(--g)}
button.run{background:var(--g);color:#04110a;border-color:var(--g);font-weight:800}
button.run:hover{background:#7dffa5;color:#04110a}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
textarea{display:block;width:100%;min-height:300px;resize:vertical;background:#050806;color:#d9f5e0;border:1px solid var(--line);padding:14px;font:inherit;font-size:13px;line-height:1.65;tab-size:2;white-space:pre;overflow:auto}
.out{border:1px solid var(--line);background:#030504;min-height:120px;padding:14px;margin-bottom:20px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.out .p{color:var(--g)}
.out .e{color:var(--red)}
.out .h{color:var(--amber)}
.out .m{color:var(--dim)}
.pn{display:flex;gap:10px;margin-bottom:30px}
@media(max-width:760px){
 .app{flex-direction:column}
 aside{width:100%;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:8px 0;overflow-x:auto}
 .brand,.hint{display:none}
 nav{display:flex;overflow-x:auto;flex:1}
 nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:6px 12px}
 nav button.on{border-bottom-color:var(--g)}
 nav button .ok{margin-left:4px}
 .runall{margin:0 10px;white-space:nowrap}
 main{padding:18px 14px}
}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">&gt; js_advanced<span class="cur"></span></div>
    <div class="hint">10 questions, one app.js</div>
    <nav id="nav" aria-label="Questions"></nav>
    <button class="btn run runall" id="runAll" type="button">Run all</button>
  </aside>
  <main>
    <div class="qhead" id="qHead">loading app.js...</div>
    <h1 id="qText"></h1>
    <div class="bar"><span id="fileName">question.js</span><span class="sp"></span>
      <button class="btn" id="reset" type="button">Reset code</button>
      <button class="btn run" id="run" type="button">Run (Ctrl+Enter)</button>
    </div>
    <textarea id="code" spellcheck="false" aria-label="Code editor"></textarea>
    <div class="bar" style="margin-top:16px"><span>output</span></div>
    <div class="out" id="out" aria-live="polite"></div>
    <div class="pn">
      <button class="btn" id="prev" type="button">Previous</button>
      <button class="btn" id="next" type="button">Next</button>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var nav = $("nav"), codeEl = $("code"), outEl = $("out");
  var items = [], current = 0;

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function fmt(v) {
    if (typeof v === "string") return v;
    if (typeof v === "object" && v !== null) {
      try { return JSON.stringify(v); } catch (e) { return String(v); }
    }
    return String(v);
  }

  function exec(code) {
    var lines = [];
    var fake = {
      log: function () { lines.push({ t: "log", s: Array.prototype.map.call(arguments, fmt).join(" ") }); },
      warn: function () { lines.push({ t: "log", s: Array.prototype.map.call(arguments, fmt).join(" ") }); },
      error: function () { lines.push({ t: "e", s: Array.prototype.map.call(arguments, fmt).join(" ") }); }
    };
    fake.info = fake.log;
    try { (new Function("console", code))(fake); }
    catch (err) { lines.push({ t: "e", s: "Error: " + err.name + ": " + err.message }); }
    if (!lines.length) lines.push({ t: "m", s: "(no output, add console.log to see a result)" });
    return lines;
  }

  function add(cls, text) {
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = text;
    outEl.appendChild(d);
  }

  function printRun(label, lines) {
    var head = document.createElement("div");
    var p = document.createElement("span");
    p.className = "p"; p.textContent = "$ ";
    head.appendChild(p);
    head.appendChild(document.createTextNode("node " + label));
    outEl.appendChild(head);
    lines.forEach(function (l) { add(l.t === "e" ? "e" : l.t === "m" ? "m" : "", l.s); });
  }

  function mark(i) { nav.children[i].classList.add("done"); }

  function select(i) {
    current = i;
    var it = items[i];
    Array.prototype.forEach.call(nav.children, function (b, k) { b.classList.toggle("on", k === i); });
    $("qHead").innerHTML = "";
    var b = document.createElement("b");
    b.textContent = "Q" + it.n;
    $("qHead").appendChild(b);
    $("qHead").appendChild(document.createTextNode(" of " + items.length));
    $("qText").textContent = it.q;
    $("fileName").textContent = "q" + pad(it.n) + ".js";
    codeEl.value = it.code;
    outEl.innerHTML = "";
    add("m", "Press Run to execute this code.");
    $("prev").disabled = i === 0;
    $("next").disabled = i === items.length - 1;
  }

  function runOne() {
    outEl.innerHTML = "";
    printRun("q" + pad(items[current].n) + ".js", exec(codeEl.value));
    mark(current);
  }

  function runAll() {
    outEl.innerHTML = "";
    items.forEach(function (it, i) {
      add("h", "// Q" + it.n);
      printRun("q" + pad(it.n) + ".js", exec(it.code));
      mark(i);
    });
  }

  function parse(text) {
    var re = /^\/\/\s*Q(\d+):[ \t]*(.*)$/gm, m, marks = [];
    while ((m = re.exec(text)) !== null) {
      marks.push({ n: parseInt(m[1], 10), q: m[2], start: m.index, end: re.lastIndex });
    }
    return marks.map(function (k, i) {
      var stop = i + 1 < marks.length ? marks[i + 1].start : text.length;
      return { n: k.n, q: k.q, code: text.slice(k.end, stop).trim() };
    });
  }

  function build(list) {
    items = list;
    items.forEach(function (it, i) {
      var b = document.createElement("button");
      b.type = "button";
      var label = document.createElement("span");
      label.textContent = "q" + pad(it.n) + ".js";
      var ok = document.createElement("span");
      ok.className = "ok"; ok.textContent = "ok";
      b.appendChild(label); b.appendChild(ok);
      b.addEventListener("click", function () { select(i); });
      nav.appendChild(b);
    });
    select(0);
  }

  $("run").addEventListener("click", runOne);
  $("runAll").addEventListener("click", function () { if (items.length) runAll(); });
  $("reset").addEventListener("click", function () { if (items.length) { codeEl.value = items[current].code; } });
  $("prev").addEventListener("click", function () { if (current > 0) select(current - 1); });
  $("next").addEventListener("click", function () { if (current < items.length - 1) select(current + 1); });
  codeEl.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runOne(); }
    if (e.key === "Tab") {
      e.preventDefault();
      var s = codeEl.selectionStart;
      codeEl.value = codeEl.value.slice(0, s) + "  " + codeEl.value.slice(codeEl.selectionEnd);
      codeEl.selectionStart = codeEl.selectionEnd = s + 2;
    }
  });

  function fail() {
    $("qHead").textContent = "app.js could not be loaded here";
    $("qText").textContent = "Open this page through a local server (VS Code Live Server) or the Vercel link. Browsers block file reading from file://.";
    $("run").disabled = true; $("runAll").disabled = true;
    $("prev").disabled = true; $("next").disabled = true;
  }

  fetch("app.js")
    .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.text(); })
    .then(function (t) { var list = parse(t); if (!list.length) throw new Error("empty"); build(list); })
    .catch(fail);
})();
</script>
</body>
</html>
